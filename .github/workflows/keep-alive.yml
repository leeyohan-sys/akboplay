# Render 무료 플랜 슬립 방지: 10분마다 health 호출
name: Keep Render Awake

on:
  schedule:
    # UTC 기준 — 약 10분마다
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping akboplay API health
        run: |
          set -e
          URL="https://akboplay-api.onrender.com/api/health"
          echo "GET $URL"
          curl -fsS --max-time 60 "$URL"
          echo
          echo "ok"
