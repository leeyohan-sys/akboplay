services:
  - type: web
    name: akboplay-api
    # 기존 서비스가 Node 런타임이라 Docker 전환이 막힐 수 있음 →
    # postinstall로 공식 Linux lilypond 바이너리를 vendor에 설치
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: GEMINI_API_KEY
        sync: false
