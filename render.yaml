services:
  - type: web
    name: akboplay-api
    runtime: docker
    plan: free
    rootDir: server
    # LilyPond 바이너리가 필요해 Docker(Debian + apt lilypond)로 빌드
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: GEMINI_API_KEY
        sync: false
